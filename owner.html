<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>留言后台 · ZOONN 之城</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/owner.css">
</head>
<body class="owner-page">

  <!-- ===== 未登录：登录 / 注册 ===== -->
  <div class="owner-gate" id="ownerGate">
    <div class="gate-card">
      <h1 class="gate-title">留言后台</h1>
      <p class="gate-sub">只有你自己需要登录。访客那边不需要。</p>

      <div class="gate-tabs" id="gateTabs">
        <button class="gate-tab is-active" data-tab="password">密码登录</button>
        <button class="gate-tab" data-tab="otp">验证码登录</button>
        <button class="gate-tab" data-tab="signup">注册</button>
      </div>

      <!-- 密码登录 -->
      <form class="gate-form" id="formPassword" data-panel="password">
        <input type="email" class="gate-input" id="pwEmail" placeholder="邮箱" autocomplete="username">
        <input type="password" class="gate-input" id="pwPassword" placeholder="密码" autocomplete="current-password">
        <button type="submit" class="gate-btn">登录</button>
        <button type="button" class="gate-link" id="toReset">忘记密码？</button>
      </form>

      <!-- 验证码登录 -->
      <form class="gate-form" id="formOtp" data-panel="otp" hidden>
        <input type="email" class="gate-input" id="otpEmail" placeholder="邮箱">
        <div class="gate-row">
          <input type="text" class="gate-input" id="otpCode" placeholder="6 位验证码" inputmode="numeric">
          <button type="button" class="gate-btn gate-btn-ghost" id="sendOtp">发送</button>
        </div>
        <button type="submit" class="gate-btn">登录</button>
      </form>

      <!-- 注册（邮箱验证 + 设密码） -->
      <form class="gate-form" id="formSignup" data-panel="signup" hidden>
        <input type="email" class="gate-input" id="suEmail" placeholder="邮箱">
        <div class="gate-row">
          <input type="text" class="gate-input" id="suCode" placeholder="6 位验证码" inputmode="numeric">
          <button type="button" class="gate-btn gate-btn-ghost" id="suSend">发送</button>
        </div>
        <input type="password" class="gate-input" id="suPassword" placeholder="设置密码（至少 6 位）" autocomplete="new-password">
        <button type="submit" class="gate-btn">注册并登录</button>
      </form>

      <!-- 重置密码 -->
      <form class="gate-form" id="formReset" data-panel="reset" hidden>
        <input type="email" class="gate-input" id="rsEmail" placeholder="邮箱">
        <div class="gate-row">
          <input type="text" class="gate-input" id="rsCode" placeholder="6 位验证码" inputmode="numeric">
          <button type="button" class="gate-btn gate-btn-ghost" id="rsSend">发送</button>
        </div>
        <input type="password" class="gate-input" id="rsPassword" placeholder="新密码" autocomplete="new-password">
        <button type="submit" class="gate-btn">重设密码</button>
      </form>

      <p class="gate-msg" id="gateMsg"></p>
      <p class="gate-note">登录只在 www.zoonn.org 这个正式域名下有效，本地预览打不开登录。</p>
    </div>
  </div>

  <!-- ===== 已登录：会话列表 + 对话 ===== -->
  <div class="owner-app" id="ownerApp" hidden>
    <aside class="owner-side">
      <div class="side-head">
        <div class="side-title">来访的人</div>
        <button class="side-refresh" id="refreshRooms" title="刷新">↻</button>
      </div>
      <div class="side-list" id="roomList">
        <div class="side-empty">还没有人来过。</div>
      </div>
      <div class="side-foot">
        <span id="ownerEmail" class="side-email"></span>
        <button class="side-signout" id="signOut">退出</button>
      </div>
    </aside>

    <main class="owner-main">
      <header class="main-head" id="mainHead">
        <div>
          <div class="main-title" id="mainTitle">选一个人开始</div>
          <div class="main-sub" id="mainSub">左侧列表按最近活动排序</div>
        </div>
        <button class="main-btn" id="toggleLive" hidden>暂停自动刷新</button>
      </header>

      <div class="owner-thread" id="thread">
        <div class="thread-empty">左边选一个来访者，就能看到他说了什么。没有人的时候，去主站自己发一条试试。</div>
      </div>

      <form class="owner-compose" id="ownerCompose" hidden>
        <textarea class="owner-input" id="ownerInput" rows="1" maxlength="2000" placeholder="以 zoonn 的身份回复…（Enter 发送，Shift+Enter 换行）"></textarea>
        <button type="submit" class="owner-send" id="ownerSend">回复</button>
      </form>
    </main>
  </div>

  <script src="js/chat-config.js"></script>
  <script src="js/chat-core.js"></script>
  <script src="js/owner.js"></script>
</body>
</html>
