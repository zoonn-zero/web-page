<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>俄罗斯方块 - ZOONN 之城</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: "Courier New", "SimSun", monospace;
    background: #2b2118;
    background-image:
      radial-gradient(circle at 20% 10%, rgba(232, 223, 208, 0.06), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(232, 223, 208, 0.05), transparent 40%);
    color: #e8dfd0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 16px;
    user-select: none;
  }

  h1 {
    font-size: 1.2rem;
    letter-spacing: 6px;
    color: #f2cc8f;
    margin-bottom: 4px;
    text-shadow: 2px 2px 0 #00000055;
  }
  .subtitle {
    font-size: 0.7rem;
    color: #8b7355;
    letter-spacing: 3px;
    margin-bottom: 14px;
  }

  .game-wrap {
    display: flex;
    gap: 14px;
    align-items: flex-start;
  }

  canvas {
    display: block;
    background: #1a130c;
    border: 3px solid #8b7355;
    border-radius: 4px;
    box-shadow: 0 0 0 3px #3d2f1f, 0 10px 30px rgba(0,0,0,0.5);
  }

  .panel {
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-width: 110px;
  }
  .box {
    border: 2px solid #8b7355;
    border-radius: 4px;
    padding: 8px 10px;
    background: rgba(0,0,0,0.25);
  }
  .box .label {
    font-size: 0.65rem;
    color: #8b7355;
    letter-spacing: 2px;
    margin-bottom: 4px;
  }
  .box .value {
    font-size: 1.15rem;
    color: #f2cc8f;
    font-weight: bold;
  }

  .hint {
    margin-top: 14px;
    font-size: 0.68rem;
    color: #8b7355;
    line-height: 1.9;
    text-align: center;
    letter-spacing: 1px;
  }
  .hint b { color: #e8dfd0; }

  /* 触屏按钮（默认隐藏，触屏设备显示） */
  .touch-controls {
    display: none;
    margin-top: 14px;
    grid-template-columns: repeat(5, 56px);
    gap: 8px;
  }
  .touch-btn {
    height: 48px;
    border: 2px solid #8b7355;
    border-radius: 6px;
    background: rgba(0,0,0,0.3);
    color: #f2cc8f;
    font-size: 1.3rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .touch-btn:active { background: #8b7355; color: #1a130c; }
  @media (hover: none) and (pointer: coarse) {
    .touch-controls { display: grid; }
  }

  /* 覆盖层：开始 / 暂停 / 结束 */
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(26, 19, 12, 0.85);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    z-index: 5;
  }
  .overlay.hidden { display: none; }
  .overlay .big {
    font-size: 1.3rem;
    letter-spacing: 4px;
    color: #f2cc8f;
  }
  .overlay .small { font-size: 0.7rem; color: #8b7355; letter-spacing: 2px; }
  .overlay button {
    margin-top: 6px;
    padding: 8px 26px;
    font-family: inherit;
    font-size: 0.85rem;
    letter-spacing: 3px;
    color: #1a130c;
    background: #f2cc8f;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    box-shadow: 0 3px 0 #8b7355;
  }
  .overlay button:active { transform: translateY(2px); box-shadow: 0 1px 0 #8b7355; }

  .stage { position: relative; }

  /* 小屏适配 */
  @media (max-width: 480px) {
    canvas { width: 240px; height: 480px; }
    .panel { min-width: 84px; }
    .box .value { font-size: 0.95rem; }
  }
</style>
</head>
<body>

<h1>俄罗斯方块</h1>
<div class="subtitle">ZOONN 之城 · 游戏厅</div>

<div class="game-wrap">
  <div class="stage">
    <canvas id="board" width="300" height="600"></canvas>
    <div class="overlay" id="overlay">
      <div class="big" id="overlayTitle">准备好了吗</div>
      <div class="small" id="overlayText">经典方块 · 消行得分</div>
      <button id="startBtn">开始游戏</button>
    </div>
  </div>

  <div class="panel">
    <div class="box">
      <div class="label">下一个</div>
      <canvas id="next" width="90" height="90"></canvas>
    </div>
    <div class="box">
      <div class="label">分数</div>
      <div class="value" id="score">0</div>
    </div>
    <div class="box">
      <div class="label">消行</div>
      <div class="value" id="lines">0</div>
    </div>
    <div class="box">
      <div class="label">等级</div>
      <div class="value" id="level">1</div>
    </div>
    <div class="box">
      <div class="label">最高分</div>
      <div class="value" id="best">0</div>
    </div>
  </div>
</div>

<div class="touch-controls">
  <button class="touch-btn" data-key="rotate">⟳</button>
  <button class="touch-btn" data-key="left">←</button>
  <button class="touch-btn" data-key="down">↓</button>
  <button class="touch-btn" data-key="right">→</button>
  <button class="touch-btn" data-key="drop">⤓</button>
</div>

<div class="hint">
  <b>← →</b> 移动 &nbsp; <b>↑</b> 旋转 &nbsp; <b>↓</b> 加速下落 &nbsp; <b>空格</b> 直落到底<br>
  <b>P</b> 暂停 &nbsp; <b>R</b> 重新开始
</div>

<script>
// ===== 俄罗斯方块 - 经典 10x20 版 =====
(function () {
  var COLS = 10, ROWS = 20, CELL = 30;

  var canvas = document.getElementById('board');
  var ctx = canvas.getContext('2d');
  var nextCanvas = document.getElementById('next');
  var nctx = nextCanvas.getContext('2d');

  var scoreEl = document.getElementById('score');
  var linesEl = document.getElementById('lines');
  var levelEl = document.getElementById('level');
  var bestEl = document.getElementById('best');
  var overlay = document.getElementById('overlay');
  var overlayTitle = document.getElementById('overlayTitle');
  var overlayText = document.getElementById('overlayText');
  var startBtn = document.getElementById('startBtn');

  // 七种方块：形状矩阵 + 配色（暖色手账风）
  var PIECES = [
    { m: [[1,1,1,1]], c: '#e07a5f' },                              // I
    { m: [[1,1],[1,1]], c: '#f2cc8f' },                             // O
    { m: [[0,1,0],[1,1,1]], c: '#81b29a' },                         // T
    { m: [[0,1,1],[1,1,0]], c: '#b56576' },                         // S
    { m: [[1,1,0],[0,1,1]], c: '#84a59d' },                         // Z
    { m: [[1,0,0],[1,1,1]], c: '#c98f5e' },                         // J
    { m: [[0,0,1],[1,1,1]], c: '#9a8c98' }                          // L
  ];

  var grid, cur, next, score, lines, level, dropCounter, dropInterval;
  var running = false, paused = false, lastTime = 0, rafId = null;

  var best = parseInt(localStorage.getItem('tetris-best') || '0', 10);
  bestEl.textContent = best;

  function emptyGrid() {
    var g = [];
    for (var r = 0; r < ROWS; r++) g.push(new Array(COLS).fill(null));
    return g;
  }

  function randPiece() {
    var p = PIECES[Math.floor(Math.random() * PIECES.length)];
    // 深拷贝矩阵
    var m = p.m.map(function (row) { return row.slice(); });
    return { m: m, c: p.c, x: Math.floor((COLS - m[0].length) / 2), y: 0 };
  }

  function collides(piece, dx, dy, mat) {
    mat = mat || piece.m;
    for (var r = 0; r < mat.length; r++) {
      for (var c = 0; c < mat[r].length; c++) {
        if (!mat[r][c]) continue;
        var nx = piece.x + c + dx, ny = piece.y + r + dy;
        if (nx < 0 || nx >= COLS || ny >= ROWS) return true;
        if (ny >= 0 && grid[ny][nx]) return true;
      }
    }
    return false;
  }

  function rotateMatrix(m) {
    var rows = m.length, cols = m[0].length;
    var out = [];
    for (var c = 0; c < cols; c++) {
      var row = [];
      for (var r = rows - 1; r >= 0; r--) row.push(m[r][c]);
      out.push(row);
    }
    return out;
  }

  function rotate() {
    if (!running || paused) return;
    var rotated = rotateMatrix(cur.m);
    // 简单踢墙：原位 / 左移1 / 右移1 / 左移2 / 右移2
    var kicks = [0, -1, 1, -2, 2];
    for (var i = 0; i < kicks.length; i++) {
      if (!collides(cur, kicks[i], 0, rotated)) {
        cur.x += kicks[i];
        cur.m = rotated;
        return;
      }
    }
  }

  function move(dx) {
    if (!running || paused) return;
    if (!collides(cur, dx, 0)) cur.x += dx;
  }

  function softDrop() {
    if (!running || paused) return;
    if (!collides(cur, 0, 1)) { cur.y++; dropCounter = 0; }
  }

  function hardDrop() {
    if (!running || paused) return;
    while (!collides(cur, 0, 1)) cur.y++;
    lock();
  }

  function lock() {
    for (var r = 0; r < cur.m.length; r++) {
      for (var c = 0; c < cur.m[r].length; c++) {
        if (cur.m[r][c]) {
          var gy = cur.y + r, gx = cur.x + c;
          if (gy < 0) { gameOver(); return; }
          grid[gy][gx] = cur.c;
        }
      }
    }
    clearLines();
    cur = next;
    next = randPiece();
    if (collides(cur, 0, 0)) gameOver();
    drawNext();
  }

  function clearLines() {
    var cleared = 0;
    for (var r = ROWS - 1; r >= 0; r--) {
      var full = true;
      for (var c = 0; c < COLS; c++) {
        if (!grid[r][c]) { full = false; break; }
      }
      if (full) {
        grid.splice(r, 1);
        grid.unshift(new Array(COLS).fill(null));
        cleared++;
        r++; // 重新检查当前行
      }
    }
    if (cleared > 0) {
      var pts = [0, 100, 300, 500, 800][cleared] * level;
      score += pts;
      lines += cleared;
      level = Math.floor(lines / 10) + 1;
      dropInterval = Math.max(80, 800 - (level - 1) * 70);
      scoreEl.textContent = score;
      linesEl.textContent = lines;
      levelEl.textContent = level;
      if (score > best) {
        best = score;
        localStorage.setItem('tetris-best', best);
        bestEl.textContent = best;
      }
    }
  }

  function drawCell(context, x, y, color, size) {
    context.fillStyle = color;
    context.fillRect(x + 1, y + 1, size - 2, size - 2);
    // 高光 + 暗边，像素感
    context.fillStyle = 'rgba(255,255,255,0.25)';
    context.fillRect(x + 1, y + 1, size - 2, 3);
    context.fillRect(x + 1, y + 1, 3, size - 2);
    context.fillStyle = 'rgba(0,0,0,0.25)';
    context.fillRect(x + 1, y + size - 4, size - 2, 3);
    context.fillRect(x + size - 4, y + 1, 3, size - 2);
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    // 网格底纹
    ctx.strokeStyle = 'rgba(232,223,208,0.05)';
    for (var r = 0; r <= ROWS; r++) {
      ctx.beginPath(); ctx.moveTo(0, r * CELL); ctx.lineTo(canvas.width, r * CELL); ctx.stroke();
    }
    for (var c = 0; c <= COLS; c++) {
      ctx.beginPath(); ctx.moveTo(c * CELL, 0); ctx.lineTo(c * CELL, canvas.height); ctx.stroke();
    }
    // 已落定的方块
    for (var y = 0; y < ROWS; y++) {
      for (var x = 0; x < COLS; x++) {
        if (grid[y][x]) drawCell(ctx, x * CELL, y * CELL, grid[y][x], CELL);
      }
    }
    // 当前方块（含落点投影）
    if (cur) {
      var ghostY = 0;
      while (!collides(cur, 0, ghostY + 1)) ghostY++;
      for (var rr = 0; rr < cur.m.length; rr++) {
        for (var cc = 0; cc < cur.m[rr].length; cc++) {
          if (cur.m[rr][cc]) {
            // 影子
            ctx.fillStyle = 'rgba(232,223,208,0.12)';
            ctx.fillRect((cur.x + cc) * CELL + 1, (cur.y + ghostY + rr) * CELL + 1, CELL - 2, CELL - 2);
            // 实体
            drawCell(ctx, (cur.x + cc) * CELL, (cur.y + rr) * CELL, cur.c, CELL);
          }
        }
      }
    }
  }

  function drawNext() {
    nctx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
    if (!next) return;
    var size = 18;
    var w = next.m[0].length * size, h = next.m.length * size;
    var ox = (nextCanvas.width - w) / 2, oy = (nextCanvas.height - h) / 2;
    for (var r = 0; r < next.m.length; r++) {
      for (var c = 0; c < next.m[r].length; c++) {
        if (next.m[r][c]) drawCell(nctx, ox + c * size, oy + r * size, next.c, size);
      }
    }
  }

  function loop(time) {
    rafId = requestAnimationFrame(loop);
    if (!running || paused) return;
    var delta = time - lastTime;
    lastTime = time;
    dropCounter += delta;
    if (dropCounter > dropInterval) {
      dropCounter = 0;
      if (!collides(cur, 0, 1)) cur.y++;
      else lock();
    }
    draw();
  }

  function start() {
    grid = emptyGrid();
    score = 0; lines = 0; level = 1;
    dropCounter = 0; dropInterval = 800;
    scoreEl.textContent = '0';
    linesEl.textContent = '0';
    levelEl.textContent = '1';
    cur = randPiece();
    next = randPiece();
    drawNext();
    running = true; paused = false;
    overlay.classList.add('hidden');
    lastTime = performance.now();
    if (!rafId) rafId = requestAnimationFrame(loop);
    draw();
  }

  function gameOver() {
    running = false;
    overlayTitle.textContent = '游戏结束';
    overlayText.textContent = '本局得分 ' + score + (score >= best ? ' · 新纪录！' : ' · 最高分 ' + best);
    startBtn.textContent = '再来一局';
    overlay.classList.remove('hidden');
  }

  function togglePause() {
    if (!running) return;
    paused = !paused;
    if (paused) {
      overlayTitle.textContent = '已暂停';
      overlayText.textContent = '按 P 或点击按钮继续';
      startBtn.textContent = '继续';
      overlay.classList.remove('hidden');
    } else {
      overlay.classList.add('hidden');
      lastTime = performance.now();
    }
  }

  // 键盘
  document.addEventListener('keydown', function (e) {
    var k = e.key;
    if (k === 'ArrowLeft') { move(-1); e.preventDefault(); }
    else if (k === 'ArrowRight') { move(1); e.preventDefault(); }
    else if (k === 'ArrowDown') { softDrop(); e.preventDefault(); }
    else if (k === 'ArrowUp') { rotate(); e.preventDefault(); }
    else if (k === ' ') { hardDrop(); e.preventDefault(); }
    else if (k === 'p' || k === 'P') togglePause();
    else if (k === 'r' || k === 'R') start();
  });

  // 触屏按钮
  document.querySelectorAll('.touch-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var key = this.getAttribute('data-key');
      if (key === 'left') move(-1);
      else if (key === 'right') move(1);
      else if (key === 'down') softDrop();
      else if (key === 'rotate') rotate();
      else if (key === 'drop') hardDrop();
    });
  });

  startBtn.addEventListener('click', function () {
    if (paused) togglePause();
    else start();
  });

  // 初始画面：画一个空棋盘
  grid = emptyGrid();
  draw();
})();
</script>
</body>
</html>
