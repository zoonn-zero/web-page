<svg xmlns="http://www.w3.org/2000/svg" width="80" height="100" viewBox="0 0 80 100">
  <!-- 信息亭 -->
  <rect x="10" y="35" width="60" height="55" fill="#4a90d9"/>
  <rect x="10" y="35" width="60" height="4" fill="#2e6ab8"/>
  <!-- 屋顶 -->
  <polygon points="5,35 40,10 75,35" fill="#c0392b"/>
  <polygon points="12,35 40,16 68,35" fill="#e74c3c"/>
  <!-- i 标志 -->
  <circle cx="40" cy="25" r="10" fill="#fff"/>
  <text x="40" y="29" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a90d9">i</text>
  <!-- 窗户 -->
  <rect x="20" y="48" width="40" height="20" fill="#b8d4f0"/>
  <line x1="40" y1="48" x2="40" y2="68" stroke="#4a90d9" stroke-width="2"/>
  <line x1="20" y1="58" x2="60" y2="58" stroke="#4a90d9" stroke-width="2"/>
  <!-- 门 -->
  <rect x="30" y="72" width="20" height="18" fill="#2e6ab8"/>
  <circle cx="46" cy="81" r="2" fill="#ffd700"/>
  <!-- 小架子/展示板 -->
  <rect x="15" y="52" width="6" height="4" fill="#fff"/>
  <rect x="59" y="52" width="6" height="4" fill="#fff"/>
</svg>
