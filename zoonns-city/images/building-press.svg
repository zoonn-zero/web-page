<svg xmlns="http://www.w3.org/2000/svg" width="120" height="100" viewBox="0 0 120 100">
  <!-- 红砖墙报社大楼 -->
  <rect x="15" y="30" width="90" height="65" fill="#b03a2e"/>
  <rect x="15" y="30" width="90" height="5" fill="#8b2500"/>
  <!-- 砖墙纹理 -->
  <g stroke="#8b2500" stroke-width="1" opacity="0.5">
    <line x1="15" y1="45" x2="105" y2="45"/>
    <line x1="15" y1="60" x2="105" y2="60"/>
    <line x1="15" y1="75" x2="105" y2="75"/>
    <line x1="30" y1="30" x2="30" y2="45"/>
    <line x1="50" y1="45" x2="50" y2="60"/>
    <line x1="70" y1="30" x2="70" y2="45"/>
    <line x1="90" y1="45" x2="90" y2="60"/>
    <line x1="40" y1="60" x2="40" y2="75"/>
    <line x1="60" y1="75" x2="60" y2="95"/>
    <line x1="80" y1="60" x2="80" y2="75"/>
  </g>
  <!-- 大窗户 -->
  <rect x="25" y="42" width="20" height="18" fill="#ffd700" opacity="0.8"/>
  <rect x="50" y="42" width="20" height="18" fill="#ffd700" opacity="0.8"/>
  <rect x="75" y="42" width="20" height="18" fill="#ffd700" opacity="0.8"/>
  <rect x="35" y="68" width="20" height="18" fill="#ffd700" opacity="0.8"/>
  <rect x="65" y="68" width="20" height="18" fill="#ffd700" opacity="0.8"/>
  <!-- 屋顶 -->
  <polygon points="10,30 60,5 110,30" fill="#6b1c12"/>
  <!-- PRESS 招牌 -->
  <rect x="35" y="15" width="50" height="14" fill="#fff"/>
  <text x="60" y="26" text-anchor="middle" font-size="10" font-weight="bold" fill="#b03a2e" font-family="monospace">PRESS</text>
  <!-- 门 -->
  <rect x="52" y="78" width="16" height="17" fill="#4a2c2a"/>
</svg>
