<svg xmlns="http://www.w3.org/2000/svg" width="200" height="180" viewBox="0 0 200 180">
  <!-- 中国地图像素简化版（占位） -->
  <rect width="200" height="180" fill="#f5f0e6" rx="4"/>
  <!-- 简化中国地图轮廓 -->
  <path d="M 50 40 L 80 30 L 120 35 L 150 50 L 170 70 L 175 100 L 160 130 L 140 150 L 110 160 L 70 155 L 45 130 L 30 100 L 35 70 Z" 
        fill="#e8dcc8" stroke="#8b7355" stroke-width="2"/>
  <!-- 省份分隔线（简化） -->
  <path d="M 80 45 L 90 80 L 70 120" stroke="#c9b896" stroke-width="1" fill="none" stroke-dasharray="3,3"/>
  <path d="M 120 50 L 130 90 L 110 130" stroke="#c9b896" stroke-width="1" fill="none" stroke-dasharray="3,3"/>
  <path d="M 60 80 L 160 85" stroke="#c9b896" stroke-width="1" fill="none" stroke-dasharray="3,3"/>
  <!-- 已访问地点红点 -->
  <circle cx="150" cy="60" r="4" fill="#e74c3c"/>
  <circle cx="100" cy="70" r="4" fill="#e74c3c"/>
  <circle cx="70" cy="90" r="4" fill="#e74c3c"/>
  <circle cx="130" cy="110" r="4" fill="#e74c3c"/>
  <circle cx="90" cy="120" r="4" fill="#e74c3c"/>
  <!-- 标题 -->
  <text x="100" y="170" text-anchor="middle" font-size="12" fill="#5d4e37" font-weight="bold">我去过的地方</text>
</svg>
