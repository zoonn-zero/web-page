<svg xmlns="http://www.w3.org/2000/svg" width="120" height="100" viewBox="0 0 120 100">
  <!-- 咖啡馆红棕色外墙 -->
  <rect x="15" y="35" width="90" height="60" fill="#a0522d"/>
  <rect x="15" y="35" width="90" height="4" fill="#8b4513"/>
  <!-- 木纹纹理 -->
  <g stroke="#8b4513" stroke-width="1" opacity="0.4">
    <line x1="15" y1="50" x2="105" y2="50"/>
    <line x1="15" y1="70" x2="105" y2="70"/>
  </g>
  <!-- 窗户 -->
  <rect x="25" y="48" width="22" height="18" fill="#ffeaa7" opacity="0.9"/>
  <line x1="36" y1="48" x2="36" y2="66" stroke="#8b4513" stroke-width="2"/>
  <line x1="25" y1="57" x2="47" y2="57" stroke="#8b4513" stroke-width="2"/>
  <rect x="73" y="48" width="22" height="18" fill="#ffeaa7" opacity="0.9"/>
  <line x1="84" y1="48" x2="84" y2="66" stroke="#8b4513" stroke-width="2"/>
  <line x1="73" y1="57" x2="95" y2="57" stroke="#8b4513" stroke-width="2"/>
  <!-- 遮阳篷 -->
  <polygon points="30,35 30,20 90,20 90,35" fill="#c0392b"/>
  <g stroke="#922b21" stroke-width="2">
    <line x1="38" y1="20" x2="38" y2="35"/>
    <line x1="50" y1="20" x2="50" y2="35"/>
    <line x1="62" y1="20" x2="62" y2="35"/>
    <line x1="74" y1="20" x2="74" y2="35"/>
    <line x1="86" y1="20" x2="86" y2="35"/>
  </g>
  <!-- 门 -->
  <rect x="48" y="70" width="24" height="25" fill="#6b3410"/>
  <circle cx="67" cy="83" r="2" fill="#ffd700"/>
  <!-- 小黑板 -->
  <rect x="5" y="60" width="15" height="22" fill="#2d5a3d"/>
  <rect x="7" y="62" width="11" height="18" fill="#1a3a26"/>
  <text x="12" y="70" text-anchor="middle" font-size="5" fill="#fff" font-family="monospace">今日</text>
  <text x="12" y="77" text-anchor="middle" font-size="5" fill="#fff" font-family="monospace">推荐</text>
  <!-- 咖啡杯标志 -->
  <ellipse cx="60" cy="28" rx="12" ry="4" fill="#fff" opacity="0.9"/>
  <path d="M 48 28 Q 48 38 60 38 Q 72 38 72 28" fill="#fff" opacity="0.9"/>
  <text x="60" y="32" text-anchor="middle" font-size="8" font-weight="bold" fill="#8b4513">☕</text>
</svg>
