<svg xmlns="http://www.w3.org/2000/svg" width="120" height="100" viewBox="0 0 120 100">
  <!-- 街机厅建筑 -->
  <rect x="10" y="35" width="100" height="60" fill="#2c1338"/>
  <!-- 紫色外墙 -->
  <rect x="10" y="35" width="100" height="60" fill="#4a235a"/>
  <!-- GAME 发光招牌 -->
  <rect x="25" y="18" width="70" height="20" fill="#000"/>
  <rect x="27" y="20" width="66" height="16" fill="#1a1a1a"/>
  <text x="60" y="32" text-anchor="middle" font-size="14" font-weight="bold" fill="#ff00ff" font-family="monospace" filter="url(#glow)">GAME</text>
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- 霓虹灯 -->
  <circle cx="20" cy="45" r="4" fill="#ff00ff"/>
  <circle cx="100" cy="45" r="4" fill="#00ffff"/>
  <circle cx="20" cy="60" r="4" fill="#00ff00"/>
  <circle cx="100" cy="60" r="4" fill="#ffff00"/>
  <circle cx="20" cy="75" r="4" fill="#ff6600"/>
  <circle cx="100" cy="75" r="4" fill="#ff0066"/>
  <!-- 大窗户 -->
  <rect x="30" y="48" width="60" height="35" fill="#1a1a1a"/>
  <!-- 街机轮廓 -->
  <rect x="35" y="55" width="18" height="25" fill="#333"/>
  <rect x="37" y="58" width="14" height="10" fill="#00ff88" opacity="0.7"/>
  <rect x="60" y="55" width="18" height="25" fill="#333"/>
  <rect x="62" y="58" width="14" height="10" fill="#ff66cc" opacity="0.7"/>
  <!-- 入口箭头 -->
  <polygon points="55,85 65,85 65,92 72,92 60,98 48,92 55,92" fill="#ffcc00"/>
  <!-- 门 -->
  <rect x="50" y="80" width="20" height="15" fill="#0a0a0a"/>
</svg>
