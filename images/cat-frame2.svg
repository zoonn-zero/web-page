<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <!-- 像素小猫 - 第2帧（跳跃） -->
  <!-- 头 -->
  <rect x="10" y="2" width="20" height="14" fill="#ff9944"/>
  <!-- 耳朵 -->
  <polygon points="10,2 12,-2 14,2" fill="#ff9944"/>
  <polygon points="26,2 28,-2 30,2" fill="#ff9944"/>
  <!-- 眼睛（开心-闭眼） -->
  <rect x="14" y="10" width="4" height="2" fill="#000"/>
  <rect x="22" y="10" width="4" height="2" fill="#000"/>
  <!-- 鼻子 -->
  <rect x="18" y="13" width="4" height="2" fill="#ffb6c1"/>
  <!-- 嘴 -->
  <path d="M 17 16 Q 20 18 23 16" stroke="#000" stroke-width="1" fill="none"/>
  <!-- 身体（缩小-跳跃姿势） -->
  <rect x="10" y="16" width="20" height="12" fill="#ff9944"/>
  <!-- 腿（收起） -->
  <rect x="12" y="28" width="4" height="4" fill="#ff9944"/>
  <rect x="24" y="28" width="4" height="4" fill="#ff9944"/>
  <!-- 尾巴（翘起） -->
  <rect x="30" y="14" width="4" height="6" fill="#ff9944"/>
  <rect x="32" y="10" width="6" height="4" fill="#ff9944"/>
</svg>
