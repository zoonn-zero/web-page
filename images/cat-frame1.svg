<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <!-- 像素小猫 - 第1帧（站立） -->
  <!-- 头 -->
  <rect x="10" y="4" width="20" height="14" fill="#ff9944"/>
  <!-- 耳朵 -->
  <polygon points="10,4 12,0 14,4" fill="#ff9944"/>
  <polygon points="26,4 28,0 30,4" fill="#ff9944"/>
  <!-- 眼睛 -->
  <rect x="14" y="9" width="3" height="3" fill="#000"/>
  <rect x="23" y="9" width="3" height="3" fill="#000"/>
  <!-- 鼻子 -->
  <rect x="18" y="13" width="4" height="2" fill="#ffb6c1"/>
  <!-- 身体 -->
  <rect x="8" y="18" width="24" height="14" fill="#ff9944"/>
  <!-- 腿 -->
  <rect x="10" y="32" width="4" height="6" fill="#ff9944"/>
  <rect x="26" y="32" width="4" height="6" fill="#ff9944"/>
  <!-- 尾巴 -->
  <rect x="32" y="20" width="6" height="4" fill="#ff9944"/>
  <rect x="36" y="16" width="4" height="6" fill="#ff9944"/>
</svg>
