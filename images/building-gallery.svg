<svg xmlns="http://www.w3.org/2000/svg" width="120" height="100" viewBox="0 0 120 100">
  <!-- 美术馆白色外墙 -->
  <rect x="15" y="30" width="90" height="65" fill="#f5f0e6"/>
  <rect x="15" y="30" width="90" height="4" fill="#d4c9b8"/>
  <!-- 柱子 -->
  <rect x="25" y="40" width="8" height="55" fill="#e8dfd0"/>
  <rect x="87" y="40" width="8" height="55" fill="#e8dfd0"/>
  <!-- 玻璃入口 -->
  <rect x="40" y="50" width="40" height="45" fill="#85c1e9" opacity="0.6"/>
  <line x1="60" y1="50" x2="60" y2="95" stroke="#f5f0e6" stroke-width="2"/>
  <line x1="40" y1="70" x2="80" y2="70" stroke="#f5f0e6" stroke-width="2"/>
  <!-- 屋顶 -->
  <polygon points="10,30 60,10 110,30" fill="#c9b896"/>
  <polygon points="20,30 60,15 100,30" fill="#dcc9a8"/>
  <!-- 展览中立牌 -->
  <rect x="95" y="65" width="18" height="25" fill="#a0522d"/>
  <rect x="97" y="67" width="14" height="21" fill="#fff8dc"/>
  <text x="104" y="78" text-anchor="middle" font-size="6" fill="#333" font-weight="bold">展览中</text>
  <rect x="102" y="90" width="4" height="5" fill="#8b4513"/>
  <!-- 装饰画 -->
  <rect x="32" y="55" width="0" height="0"/>
</svg>
