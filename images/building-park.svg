<svg xmlns="http://www.w3.org/2000/svg" width="120" height="100" viewBox="0 0 120 100">
  <!-- 公园绿地 -->
  <rect x="5" y="40" width="110" height="55" fill="#7ec850" rx="8"/>
  <!-- 池塘 -->
  <ellipse cx="85" cy="70" rx="22" ry="15" fill="#5dade2"/>
  <ellipse cx="85" cy="68" rx="18" ry="11" fill="#85c1e9"/>
  <!-- 树木 -->
  <circle cx="25" cy="50" r="15" fill="#4a9c2d"/>
  <rect x="23" y="60" width="4" height="12" fill="#8b5a2b"/>
  <circle cx="50" cy="45" r="12" fill="#58b540"/>
  <rect x="48" y="53" width="4" height="10" fill="#8b5a2b"/>
  <!-- 花朵 -->
  <circle cx="35" cy="75" r="3" fill="#ff69b4"/>
  <circle cx="60" cy="80" r="3" fill="#ffd700"/>
  <circle cx="70" cy="55" r="3" fill="#ff6347"/>
  <circle cx="40" cy="85" r="3" fill="#9370db"/>
  <!-- 长椅 -->
  <rect x="15" y="75" width="25" height="4" fill="#8b4513"/>
  <rect x="17" y="79" width="3" height="8" fill="#8b4513"/>
  <rect x="35" y="79" width="3" height="8" fill="#8b4513"/>
  <!-- 告示栏 -->
  <rect x="95" y="25" width="20" height="25" fill="#deb887"/>
  <rect x="97" y="27" width="16" height="21" fill="#f5deb3"/>
  <rect x="104" y="50" width="2" height="8" fill="#8b4513"/>
  <text x="105" y="35" text-anchor="middle" font-size="5" fill="#333">地图</text>
  <!-- 像素小猫 -->
  <g transform="translate(55, 70)">
    <!-- 身体 -->
    <rect x="0" y="5" width="20" height="12" fill="#ff9944"/>
    <!-- 头 -->
    <rect x="15" y="0" width="14" height="12" fill="#ff9944"/>
    <!-- 耳朵 -->
    <polygon points="15,0 17,-5 19,0" fill="#ff9944"/>
    <polygon points="25,0 27,-5 29,0" fill="#ff9944"/>
    <!-- 眼睛 -->
    <rect x="18" y="4" width="2" height="2" fill="#000"/>
    <rect x="24" y="4" width="2" height="2" fill="#000"/>
    <!-- 鼻子 -->
    <rect x="21" y="7" width="2" height="2" fill="#ffb6c1"/>
    <!-- 尾巴 -->
    <rect x="-3" y="6" width="5" height="3" fill="#ff9944"/>
    <rect x="-6" y="4" width="3" height="4" fill="#ff9944"/>
    <!-- 腿 -->
    <rect x="2" y="17" width="3" height="4" fill="#ff9944"/>
    <rect x="15" y="17" width="3" height="4" fill="#ff9944"/>
  </g>
</svg>
