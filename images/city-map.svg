<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <!-- 草地背景 -->
  <rect width="1200" height="800" fill="#7ec850"/>
  <!-- 草地纹理点 -->
  <g fill="#6ab040">
    <circle cx="50" cy="80" r="3"/><circle cx="120" cy="150" r="2"/><circle cx="200" cy="60" r="3"/>
    <circle cx="350" cy="120" r="2"/><circle cx="500" cy="200" r="3"/><circle cx="650" cy="90" r="2"/>
    <circle cx="800" cy="180" r="3"/><circle cx="950" cy="70" r="2"/><circle cx="1100" cy="150" r="3"/>
    <circle cx="80" cy="300" r="2"/><circle cx="250" cy="400" r="3"/><circle cx="420" cy="350" r="2"/>
    <circle cx="600" cy="450" r="3"/><circle cx="780" cy="380" r="2"/><circle cx="950" cy="500" r="3"/>
    <circle cx="1100" cy="420" r="2"/><circle cx="150" cy="600" r="3"/><circle cx="380" cy="680" r="2"/>
    <circle cx="550" cy="620" r="3"/><circle cx="720" cy="700" r="2"/><circle cx="900" cy="650" r="3"/>
    <circle cx="1080" cy="720" r="2"/><circle cx="50" cy="500" r="3"/><circle cx="1150" cy="300" r="2"/>
  </g>
  <!-- 横向主路 -->
  <rect x="0" y="380" width="1200" height="60" fill="#c9b896"/>
  <rect x="0" y="380" width="1200" height="4" fill="#a89070"/>
  <rect x="0" y="436" width="1200" height="4" fill="#a89070"/>
  <!-- 纵向主路 -->
  <rect x="580" y="0" width="60" height="800" fill="#c9b896"/>
  <rect x="580" y="0" width="4" height="800" fill="#a89070"/>
  <rect x="636" y="0" width="4" height="800" fill="#a89070"/>
  <!-- 路口 -->
  <rect x="580" y="380" width="60" height="60" fill="#c9b896"/>
  <!-- 道路虚线 -->
  <g stroke="#fff" stroke-width="3" stroke-dasharray="15,15">
    <line x1="0" y1="410" x2="580" y2="410"/>
    <line x1="640" y1="410" x2="1200" y2="410"/>
    <line x1="610" y1="0" x2="610" y2="380"/>
    <line x1="610" y1="440" x2="610" y2="800"/>
  </g>
  <!-- 装饰树木 -->
  <g>
    <circle cx="100" cy="200" r="20" fill="#4a9c2d"/>
    <rect x="97" y="215" width="6" height="15" fill="#8b5a2b"/>
    <circle cx="1050" cy="200" r="20" fill="#4a9c2d"/>
    <rect x="1047" y="215" width="6" height="15" fill="#8b5a2b"/>
    <circle cx="100" cy="650" r="20" fill="#4a9c2d"/>
    <rect x="97" y="665" width="6" height="15" fill="#8b5a2b"/>
    <circle cx="1050" cy="650" r="20" fill="#4a9c2d"/>
    <rect x="1047" y="665" width="6" height="15" fill="#8b5a2b"/>
  </g>
</svg>
